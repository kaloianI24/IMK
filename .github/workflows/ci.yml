name: CI
on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: 'site/.node-version', cache: 'npm', cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Typecheck
        run: npm run check
      - name: Static invariant check
        run: |
          test "$(grep -o "output:[[:space:]]*'static'" astro.config.mjs | head -1)" != ""
          ! grep -r "@astrojs/cloudflare" package.json
          test -f api/contact.ts
          test -f site/functions/api/contact.ts
      - name: Secrets-in-bundle check
        run: |
          if grep -R -nE "TURNSTILE_SECRET_KEY|RESEND_API_KEY" dist/ ; then echo "leak"; exit 1; fi
          echo ok

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: 'site/.node-version', cache: 'npm', cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run build
      # Plan §6: mobile, median of 5 runs, ≥90 all four categories on Home, a
      # service page and /book (plus /pricing). The color scheme is pinned in
      # .lighthouserc.cjs so the gate is reproducible across machines.
      - name: Lighthouse CI
        run: npm run lhci
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            qa/artifacts/lighthouse/
            .lighthouseci/

  deploy-vercel:
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 'Guard: VERCEL_TOKEN required'
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not set."
            echo "Deploys are disabled: add VERCEL_TOKEN to repository secrets to enable automatic Vercel deploys of site/."
            exit 1
          fi
          echo "VERCEL_TOKEN is present. The deploy step is deliberately not wired yet:"
          echo "link the project in the Vercel dashboard first, then uncomment the recipe below."
          # Example deploy step (enable only after the Vercel project is linked):
          # - uses: actions/setup-node@v4
          #   with: { node-version-file: 'site/.node-version', cache: 'npm', cache-dependency-path: site/package-lock.json }
          # - run: npm ci
          # - run: npx vercel --prod --token $VERCEL_TOKEN
          #   env:
          #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
